theme = "celadon"
publishDir = "docs"  # GitHub Pages serves master:/docs
baseURL = "https://tieraugen.doctor/"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false  # keep German URLs (and Jekyll aliases) at the root
title = "Tierauge im Fokus"
enableRobotsTXT = true

[params]
  description = "Spezialisierte Augenheilkunde, persönliche Betreuung und eine enge Zusammenarbeit mit Ihrer Haustierarztpraxis – mit Dr. Sabine Sahr in Greifswald und Neubrandenburg."

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "friendly"
    noClasses = false
    lineNos = true
    guessSyntax = true

[[cascade]]
  layout = "single"
  [cascade.target]
    path = "/**"
    kind = "page"

[outputs]
  home = ["HTML", "JSON"]

[params.homepage]
  sections = ["praxis", "about", "vertrauen", "leistungen", "ablauf", "fuertieraerzte", "wissenteaser", "sprechzeiten", "kontakt", "anfahrt"]

  [params.homepage.praxis]
    enable = true
    layout = "brand-hero"
    showInMenu = false

  [params.homepage.about]
    enable = true
    layout = "hero"
    title = "Über mich"

  [params.homepage.vertrauen]
    enable = true
    layout = "trustbar"
    showInMenu = false

  [params.homepage.leistungen]
    enable = true
    layout = "leistungen"
    title = "Unsere Leistungsbereiche"
    showInMenu = false

  [params.homepage.ablauf]
    enable = true
    layout = "steps"
    title = "Was geschieht bei einer Augenuntersuchung?"
    showInMenu = false

  [params.homepage.sprechzeiten]
    enable = true
    layout = "hours"
    title = "Sprechzeiten"

  [params.homepage.kontakt]
    enable = true
    layout = "contact"
    title = "Kontakt"

  [params.homepage.anfahrt]
    enable = true
    layout = "map"
    title = "Anfahrt"

  [params.homepage.fuertieraerzte]
    enable = true
    layout = "teaser"
    title = "Für überweisende Tierärzte"
    text = "Die spezialisierte Diagnostik und Behandlung erfolgt in enger Abstimmung mit der überweisenden Haustierarztpraxis. Nach Abschluss der Behandlung werden Befunde, Therapieplan und Empfehlungen übermittelt und der Patient zurücküberwiesen."
    ctaLabel = "Informationen für Tierärzte"
    ctaUrl = "/fuer-tieraerzte/"
    showInMenu = false

  [params.homepage.wissenteaser]
    enable = true
    layout = "teaser"
    title = "Tieraugen verstehen"
    text = "Verständliche Informationen zu häufigen Augenerkrankungen bei Hund und Katze, Fallberichten und Fortbildungen."
    ctaLabel = "Zur Wissensbank"
    ctaUrl = "/wissen/"
    showInMenu = false

[params.nav]
  moreLabel = "Mehr"

  [[params.nav.primaryLinks]]
    title = "Startseite"
    url = "/"

  [[params.nav.primaryLinks]]
    title = "Augenheilkunde"
    url = "/augenheilkunde/"

  [[params.nav.primaryLinks]]
    title = "Augenoperationen"
    url = "/augenoperationen/"

  [[params.nav.primaryLinks]]
    title = "Über mich"
    url = "/ueber-mich/"

  [[params.nav.primaryLinks]]
    title = "Wissen"
    url = "/wissen/"

  [[params.nav.primaryLinks]]
    title = "Für Tierärzte"
    url = "/fuer-tieraerzte/"

  [[params.nav.primaryLinks]]
    title = "Standorte & Kontakt"
    url = "/standorte-kontakt/"

  [[params.nav.extraLinks]]
    title = "Impressum"
    url = "/impressum/"

  [[params.nav.extraLinks]]
    title = "Datenschutz"
    url = "/datenschutz/"

# English and Polish cover the homepage and the practice pages; the Wissen area
# (wissensbank, vortraege, patientengeschichten) stays German-only, so it is left
# out of these languages' nav and homepage teaser.
[languages]
  [languages.de]
    locale = "de-DE"
    label = "Deutsch"
    weight = 1

  [languages.en]
    locale = "en-GB"
    label = "English"
    weight = 2
    [languages.en.params]
      description = "Specialised veterinary ophthalmology, personal care and close cooperation with your family vet – with Dr. Sabine Sahr in Greifswald and Neubrandenburg."
      [languages.en.params.homepage.about]
        title = "About me"
      [languages.en.params.homepage.leistungen]
        title = "Our services"
      [languages.en.params.homepage.ablauf]
        title = "What happens during an eye examination?"
      [languages.en.params.homepage.sprechzeiten]
        title = "Consultation hours"
      [languages.en.params.homepage.kontakt]
        title = "Contact"
      [languages.en.params.homepage.anfahrt]
        title = "Directions"
      [languages.en.params.homepage.fuertieraerzte]
        title = "For referring vets"
        text = "Specialised diagnostics and treatment are carried out in close consultation with the referring practice. Once treatment is complete, findings, treatment plan and recommendations are sent back and the patient is referred back to their family vet."
        ctaLabel = "Information for vets"
      [languages.en.params.homepage.wissenteaser]
        enable = false
      [languages.en.params.nav]
        moreLabel = "More"
        primaryLinks = [
          { title = "Home", url = "/" },
          { title = "Ophthalmology", url = "/augenheilkunde/" },
          { title = "Eye surgery", url = "/augenoperationen/" },
          { title = "About me", url = "/ueber-mich/" },
          { title = "For vets", url = "/fuer-tieraerzte/" },
          { title = "Locations & contact", url = "/standorte-kontakt/" },
        ]
        extraLinks = [
          { title = "Legal notice", url = "/impressum/" },
          { title = "Privacy", url = "/datenschutz/" },
        ]

  [languages.pl]
    locale = "pl-PL"
    label = "Polski"
    weight = 3
    [languages.pl.params]
      description = "Specjalistyczna okulistyka weterynaryjna, indywidualna opieka i ścisła współpraca z Państwa lekarzem weterynarii – z dr Sabine Sahr w Greifswaldzie i Neubrandenburgu."
      [languages.pl.params.homepage.about]
        title = "O mnie"
      [languages.pl.params.homepage.leistungen]
        title = "Nasze usługi"
      [languages.pl.params.homepage.ablauf]
        title = "Jak przebiega badanie okulistyczne?"
      [languages.pl.params.homepage.sprechzeiten]
        title = "Godziny przyjęć"
      [languages.pl.params.homepage.kontakt]
        title = "Kontakt"
      [languages.pl.params.homepage.anfahrt]
        title = "Dojazd"
      [languages.pl.params.homepage.fuertieraerzte]
        title = "Dla lekarzy kierujących"
        text = "Specjalistyczna diagnostyka i leczenie odbywają się w ścisłym porozumieniu z kierującą lecznicą. Po zakończeniu leczenia przekazujemy wyniki badań, plan terapii i zalecenia, a pacjent wraca pod opiekę swojego lekarza weterynarii."
        ctaLabel = "Informacje dla lekarzy weterynarii"
      [languages.pl.params.homepage.wissenteaser]
        enable = false
      [languages.pl.params.nav]
        moreLabel = "Więcej"
        primaryLinks = [
          { title = "Strona główna", url = "/" },
          { title = "Okulistyka", url = "/augenheilkunde/" },
          { title = "Operacje oczu", url = "/augenoperationen/" },
          { title = "O mnie", url = "/ueber-mich/" },
          { title = "Dla lekarzy", url = "/fuer-tieraerzte/" },
          { title = "Lokalizacje i kontakt", url = "/standorte-kontakt/" },
        ]
        extraLinks = [
          { title = "Nota prawna", url = "/impressum/" },
          { title = "Prywatność", url = "/datenschutz/" },
        ]
