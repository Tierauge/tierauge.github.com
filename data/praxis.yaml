name: "Tierauge im Fokus"
tagline: "Spezialisierte Augenheilkunde für Tiere"
logo: "images/brand/logo.png"
text: >
  Tierauge im Fokus steht für Augenheilkunde bei Tieren. Wir verbinden moderne ophthalmologische
  Diagnostik mit persönlicher Betreuung – von der Zuchtuntersuchung über die
  Abklärung akuter Beschwerden bis zur Behandlung chronischer
  Augenerkrankungen, stets in enger Abstimmung mit Ihrer Haustierarztpraxis.
