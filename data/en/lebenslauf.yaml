- date: "10/2002 – 02/2008"
  title: "Veterinary studies"
  text: "Studied veterinary medicine at [Leipzig University](https://www.vetmed.uni-leipzig.de/), graduating with the state examination."
- date: "03/2008 – 07/2012"
  title: "Small Animal Clinic, Leipzig University"
  text: "Worked at the [Small Animal Clinic](https://kleintierklinik.uni-leipzig.de/klinik) in the departments of ophthalmology, internal medicine and brachycephaly, and taught ophthalmology to students and in continuing education for vets."
- date: "03/2008 – 02/2014"
  title: "Doctoral thesis"
  text: "[Vergleichende computertomografische Untersuchungen zur Anatomie der tränenableitenden Wege bei brachyzephalen Hunden](https://nbn-resolving.org/urn:nbn:de:bsz:15-qucosa-143903) (comparative CT study of the anatomy of the nasolacrimal drainage system in brachycephalic dogs) – ==summa cum laude==."
- date: "01/2011"
  title: "Additional qualification in ophthalmology"
  text: "Awarded the [veterinary additional qualification in ophthalmology](https://www.tieraerztekammer-nordrhein.de/tieraerzte/fachtierarzt-zusatzbezeichnung/) (Zusatzbezeichnung Augenheilkunde) – a qualification examined by the Veterinary Chamber, with a set period of further training, documented cases and a specialist exam."
- date: "09/2012 – 08/2018"
  title: "Augen-Tierarztpraxis Dr. I. Allgoewer, Berlin"
  text: "Six years as a veterinary ophthalmologist at the specialist [practice of Dr. I. Allgoewer](https://www.tieraugen.com/)."
- date: "03/2015"
  title: "FVO Award"
  text: "Doctoral thesis honoured with the [FVO Förderpreis 2015](https://www.fvo-vet.de/foerderpreis.htm)."
- date: "12/2015"
  title: "Member of the Dortmunder Kreis (DOK)"
  text: "Licensed as an examiner for [hereditary eye diseases](https://www.dok-vet.de)."
- date: "04/2019 – 03/2021"
  title: "Anicura Tierklinik Potsdam"
  text: "Head of ophthalmology at the [Anicura Tierklinik Potsdam](https://www.anicura.de/standorte/potsdam/)."
- date: "since 04/2021"
  title: "Gemeinschaftspraxis Quandt und Bracke, Greifswald"
  text: "Back home – since then veterinary ophthalmologist at the [Tierärztliche Gemeinschaftspraxis Quandt und Bracke](https://www.tieraerzte-quandtundbracke.de/quandtundbracke) and at the Tierarztpraxis für Kleintiere Dipl.-Vet.-Med. Andrea Lehmann in Neubrandenburg."
