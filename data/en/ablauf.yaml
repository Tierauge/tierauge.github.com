- step: "1"
  title: "Listening and observing"
  text: "We go through your pet's history and watch how your animal behaves."
- step: "2"
  title: "Testing function"
  text: "Vision, pupillary light reflexes and the dazzle reflex are tested."
- step: "3"
  title: "Examining the eye in detail"
  text: "Slit lamp, intraocular pressure and further targeted diagnostics – depending on the findings."
- step: "4"
  title: "Explaining the findings clearly"
  text: "We discuss the findings and the next steps together with you."
