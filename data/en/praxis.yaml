name: "Tierauge im Fokus"
tagline: "Specialised ophthalmology for animals"
logo: "images/brand/logo.png"
text: >
  Tierauge im Fokus stands for ophthalmology for animals. We combine modern ophthalmic diagnostics with personal
  care – from breeding examinations and the investigation of acute problems
  to the treatment of chronic eye diseases, always in close consultation
  with your family vet.
