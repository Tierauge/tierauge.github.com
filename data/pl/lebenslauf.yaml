- date: "10/2002 – 02/2008"
  title: "Studia weterynaryjne"
  text: "Studia na [Uniwersytecie w Lipsku](https://www.vetmed.uni-leipzig.de/), zakończone państwowym egzaminem końcowym (Staatsexamen)."
- date: "03/2008 – 07/2012"
  title: "Klinika Małych Zwierząt Uniwersytetu w Lipsku"
  text: "Praca w [Klinice Małych Zwierząt](https://kleintierklinik.uni-leipzig.de/klinik) na oddziałach okulistyki, chorób wewnętrznych i brachycefalii oraz działalność dydaktyczna w zakresie okulistyki – w kształceniu studentów i szkoleniach dla lekarzy weterynarii."
- date: "03/2008 – 02/2014"
  title: "Rozprawa doktorska"
  text: "[Vergleichende computertomografische Untersuchungen zur Anatomie der tränenableitenden Wege bei brachyzephalen Hunden](https://nbn-resolving.org/urn:nbn:de:bsz:15-qucosa-143903) (Porównawcze badania tomografii komputerowej anatomii dróg odprowadzających łzy u psów ras brachycefalicznych) – ==summa cum laude==."
- date: "01/2011"
  title: "Dodatkowa kwalifikacja z okulistyki"
  text: "Uzyskanie [weterynaryjnej kwalifikacji dodatkowej z okulistyki (Zusatzbezeichnung Augenheilkunde)](https://www.tieraerztekammer-nordrhein.de/tieraerzte/fachtierarzt-zusatzbezeichnung/) – potwierdzenie kwalifikacji nadawane przez izbę lekarsko-weterynaryjną, wymagające określonego czasu kształcenia, udokumentowanych przypadków i egzaminu specjalistycznego."
- date: "09/2012 – 08/2018"
  title: "Augen-Tierarztpraxis Dr. I. Allgoewer, Berlin"
  text: "Sześć lat pracy jako lekarz weterynarii okulista w specjalistycznym [gabinecie dr I. Allgoewer](https://www.tieraugen.com/)."
- date: "03/2015"
  title: "Nagroda FVO-Förderpreis"
  text: "Wyróżnienie rozprawy doktorskiej nagrodą [FVO-Förderpreis 2015](https://www.fvo-vet.de/foerderpreis.htm)."
- date: "12/2015"
  title: "Członkini Dortmunder Kreis (DOK)"
  text: "Uprawnienia do przeprowadzania badań w kierunku [dziedzicznych chorób oczu](https://www.dok-vet.de)."
- date: "04/2019 – 03/2021"
  title: "Anicura Tierklinik Potsdam"
  text: "Prowadzenie działu okulistyki w [Anicura Tierklinik Potsdam](https://www.anicura.de/standorte/potsdam/)."
- date: "od 04/2021"
  title: "Gemeinschaftspraxis Quandt und Bracke, Greifswald"
  text: "Powrót w rodzinne strony – od tego czasu lekarz weterynarii okulista w [Tierärztliche Gemeinschaftspraxis Quandt und Bracke](https://www.tieraerzte-quandtundbracke.de/quandtundbracke) oraz w Tierarztpraxis für Kleintiere Dipl.-Vet.-Med. Andrea Lehmann w Neubrandenburgu."
