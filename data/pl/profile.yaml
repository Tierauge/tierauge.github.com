subline: "Indywidualna opieka, staranna diagnostyka i specjalistyczna okulistyka weterynaryjna dla psów i kotów."
name: "Dr. Sabine Sahr"
title: "Lekarz weterynarii z dodatkową kwalifikacją z okulistyki"
affiliation: "Członkini [Dortmunder Kreis (DOK)](https://www.dok-vet.de) – stowarzyszenia zajmującego się diagnostyką genetycznie uwarunkowanych chorób oczu"
summary: >
  Po 4 latach pracy w Klinice Małych Zwierząt Uniwersytetu w Lipsku przez 6 lat
  pracowałam w okulistycznej praktyce weterynaryjnej dr I. Allgoewer w Berlinie.
  Następnie przez 2 lata prowadziłam dział okulistyki w Anicura Tierklinik Potsdam,
  a teraz wróciłam w rodzinne strony i jestem częścią zespołu
  [Tierarztpraxis Quandt und Bracke](https://www.tieraerzte-quandtundbracke.de/quandtundbracke).
