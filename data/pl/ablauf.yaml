- step: "1"
  title: "Słuchamy i obserwujemy"
  text: "Omawiamy dotychczasowy przebieg choroby i obserwujemy zachowanie Państwa zwierzęcia."
- step: "2"
  title: "Sprawdzamy funkcję oka"
  text: "Badamy zdolność widzenia, odruchy źreniczne i odruch olśnienia."
- step: "3"
  title: "Dokładnie badamy oko"
  text: "Lampa szczelinowa, pomiar ciśnienia wewnątrzgałkowego i dalsza ukierunkowana diagnostyka – w zależności od wyniku."
- step: "4"
  title: "Zrozumiale wyjaśniamy wynik"
  text: "Omawiamy wynik badania i dalsze kroki wspólnie z Państwem."
