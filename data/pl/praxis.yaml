name: "Tierauge im Fokus"
tagline: "Specjalistyczna okulistyka weterynaryjna"
logo: "images/brand/logo.png"
text: >
  Tierauge im Fokus to okulistyka dla zwierząt. Łączymy nowoczesną diagnostykę okulistyczną
  z indywidualną opieką – od badań hodowlanych, przez diagnostykę ostrych
  dolegliwości, aż po leczenie przewlekłych chorób oczu, zawsze w ścisłym
  porozumieniu z Państwa lekarzem weterynarii.
