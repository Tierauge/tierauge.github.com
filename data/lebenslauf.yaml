- date: "10/2002 – 02/2008"
  title: "Studium der Veterinärmedizin"
  text: "Studium an der [Universität Leipzig](https://www.vetmed.uni-leipzig.de/), Abschluss mit Staatsexamen."
- date: "03/2008 – 07/2012"
  title: "Klinik für Kleintiere der Universität Leipzig"
  text: "Tätigkeit in der [Klinik für Kleintiere](https://kleintierklinik.uni-leipzig.de/klinik) in den Abteilungen Augenheilkunde, Innere Medizin und Brachyzephalie sowie Lehrtätigkeit in der studentischen und tierärztlichen Fortbildung im Bereich Ophthalmologie."
- date: "03/2008 – 02/2014"
  title: "Dissertation"
  text: "[Vergleichende computertomografische Untersuchungen zur Anatomie der tränenableitenden Wege bei brachyzephalen Hunden](https://nbn-resolving.org/urn:nbn:de:bsz:15-qucosa-143903) – ==summa cum laude==."
- date: "01/2011"
  title: "Zusatzbezeichnung Augenheilkunde"
  text: "Erwerb der [tierärztlichen Zusatzbezeichnung Augenheilkunde](https://www.tieraerztekammer-nordrhein.de/tieraerzte/fachtierarzt-zusatzbezeichnung/) – ein von der Tierärztekammer geprüfter Qualifikationsnachweis mit festgelegter Weiterbildungszeit, dokumentierten Fällen und Fachprüfung."
- date: "09/2012 – 08/2018"
  title: "Augen-Tierarztpraxis Dr. I. Allgoewer, Berlin"
  text: "Sechs Jahre als Augentierärztin in der spezialisierten [Praxis von Dr. I. Allgoewer](https://www.tieraugen.com/)."
- date: "03/2015"
  title: "FVO-Förderpreis"
  text: "Auszeichnung der Dissertation mit dem [FVO-Förderpreis 2015](https://www.fvo-vet.de/foerderpreis.htm)."
- date: "12/2015"
  title: "Mitglied im Dortmunder Kreis (DOK)"
  text: "Zulassung als Untersucherin auf [erbliche Augenerkrankungen](https://www.dok-vet.de)."
- date: "04/2019 – 03/2021"
  title: "Anicura Tierklinik Potsdam"
  text: "Übernahme der Augenheilkunde in der [Anicura Tierklinik Potsdam](https://www.anicura.de/standorte/potsdam/)."
- date: "seit 04/2021"
  title: "Gemeinschaftspraxis Quandt und Bracke, Greifswald"
  text: "Rückkehr in die Heimat – seither Augentierärztin in der [Tierärztlichen Gemeinschaftspraxis Quandt und Bracke](https://www.tieraerzte-quandtundbracke.de/quandtundbracke) sowie in der Tierarztpraxis für Kleintiere Dipl.-Vet.-Med. Andrea Lehmann in Neubrandenburg."
