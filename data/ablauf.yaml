- step: "1"
  title: "Zuhören und beobachten"
  text: "Wir besprechen die Vorgeschichte und beobachten das Verhalten Ihres Tieres."
- step: "2"
  title: "Funktion prüfen"
  text: "Sehfähigkeit, Pupillarreflexe und Blendreflex werden geprüft."
- step: "3"
  title: "Das Auge genau untersuchen"
  text: "Spaltlampe, Augeninnendruck und weitere gezielte Diagnostik – je nach Befund."
- step: "4"
  title: "Befund verständlich erklären"
  text: "Wir besprechen den Befund und die weiteren Schritte gemeinsam mit Ihnen."
